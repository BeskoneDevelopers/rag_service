[project]
name = "rag-service"
version = "0.1.0"
description = "RAG сервис на FastAPI"
readme="README.md"
dependencies = [
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.3",
    "celery[redis]==5.7.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "pgvector==0.5.1",
    "aiofiles==25.1.0",
    "python-multipart==0.0.33",
    "python-docx==1.2.0",
    "pymupdf==2.1",
    "sentence-transformers==6.3.0",
    "httpx==0.28.1",
    "PyJWT==2.10.1",
    "markdown-it-py==4.2.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
